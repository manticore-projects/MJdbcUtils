import se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask

buildscript {
    dependencies {
        classpath group: 'net.sf.saxon', name: 'Saxon-HE', version: 'latest.release'
    }
}

plugins {
    id 'java-library'
    id "com.vanniktech.maven.publish" version "latest.release"
    id 'maven-publish'
    id 'signing'

    id 'jacoco'
    id 'com.github.kt3k.coveralls' version "latest.release"
    id 'pmd'
    id 'checkstyle'

    id "se.bjurr.gitchangelog.git-changelog-gradle-plugin" version "latest.release"
    id "com.diffplug.spotless" version "latest.release"
    id "com.github.hierynomus.license" version "latest.release"
    id "com.nwalsh.gradle.saxon.saxon-gradle" version "latest.release"
    id 'biz.aQute.bnd.builder' version "latest.release"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    }
}

configurations {
    xmlDoclet
}

dependencies {
    api 'com.manticore-projects.jsqlformatter:jsqlparser:+'
    api 'org.apache.commons:commons-collections4:4.+'

    testImplementation platform('org.junit:junit-bom:5.+')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.h2database:h2:2.+'
    xmlDoclet 'com.manticore-projects.tools:xml-doclet:+'
}

def getVersion = { boolean considerSnapshot ->
    Integer major = 0
    Integer minor = 0
    Integer patch = null
    Integer build = null
    String commit = null
    String snapshot = ""

    def versionStr = providers.exec {
        commandLine "git", "--no-pager", "-C", project.projectDir, "describe", "--tags", "--always", "--dirty=-SNAPSHOT"
    }.standardOutput.asText.get().trim()

    def pattern = /(?<major>\d*)\.(?<minor>\d*)(\.(?<patch>\d*))?(-(?<build>\d*)-(?<commit>[a-zA-Z\d]*))?/
    def matcher = versionStr =~ pattern

    if (matcher.find()) {
        major = matcher.group('major') as Integer ?: 0
        minor = matcher.group('minor') as Integer ?: 0
        patch = matcher.group('patch') as Integer ?: null
        build = matcher.group('build') as Integer ?: null
        commit = matcher.group('commit') ?: null
    }

    if (considerSnapshot && (versionStr.endsWith('SNAPSHOT') || build != null)) {
        minor++
        if (patch != null) patch = 0
        snapshot = "-SNAPSHOT"
    }

    return patch != null
            ? "${major}.${minor}.${patch}${snapshot}"
            : "${major}.${minor}${snapshot}"
}

// for publishing a release, call Gradle with Environment Variable RELEASE:
// RELEASE=true gradle :publish
version = getVersion( !System.getenv("RELEASE") )
group = 'com.manticore-projects.jdbc'
description = 'Java Library for Named Parameters (e.g. :Customer_Id ) in Queries or DML/DDL statements.'

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    options.addBooleanOption("Xdoclint:none", true)
}

tasks.register('xmldoc', Javadoc) {
    dependsOn(compileJava)

    def outFile = layout.buildDirectory.file("reports/xmlDoclet/javadoc.xml").get().asFile
    source = sourceSets.main.allJava
    classpath = sourceSets.main.runtimeClasspath
    title = "MJDBCUtils API $version"
    destinationDir = layout.buildDirectory.dir("reports/xmlDoclet").get().asFile
    options.docletpath = configurations.xmlDoclet.files as List
    options.doclet = "com.manticore.tools.xmldoclet.XmlDoclet"
    options.addStringOption("basePackage", "com.manticore.jdbc")
    options.addStringOption("filename", outFile.getName())

    doLast {
        copy {
            from outFile
            into rootProject.layout.projectDirectory.dir("src/site/sphinx/_static").asFile
        }
    }
}


test {
    useJUnitPlatform()
    jacoco {
        excludes = ['net/sf/jsqlparser/parser/CCJSqlParserTokenManager']
    }
}

license {
    header = project.file('LICENSE')

    // the sources carry the header as a JavaDoc comment ("/**"), not as "/*"; without this
    // mapping every single file is reported as "Missing header"
    mapping {
        java = 'JAVADOC_STYLE'
    }
    ext.year = Calendar.getInstance().get(Calendar.YEAR)
    ext.name = 'manticore-projects Co. Ltd.'
    ext.email = 'support@manticore-projects.com'

    strictCheck = false
    ignoreFailures = true
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.96
            }
            excludes = [
            ]
        }
        rule {
            limit {
                counter = 'LINE'
                value = 'MISSEDCOUNT'
                maximum = 20
            }
            excludes = [
            ]
        }
    }
}

coveralls {
    jacocoReportPath 'build/reports/jacoco/test/jacocoTestReport.xml'
}


pmd {
    consoleOutput = true
    sourceSets = [sourceSets.main, sourceSets.test]

    // clear the ruleset in order to use configured rules only
    ruleSets = []

    //rulesMinimumPriority = 1

    ruleSetFiles = files("config/pmd/ruleset.xml")

    pmdMain {
        excludes = [
                "build/generated/*"
        ]
    }
}

checkstyle {
    sourceSets = [sourceSets.main, sourceSets.test]
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

spotless {
    // optional: limit format enforcement to just the files changed by this feature branch
    ratchetFrom 'origin/main'

    format 'misc', {
        // define the files to apply `misc` to
        target '*.rst', '*.md', '.gitignore'

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces(4) // or spaces. Takes an integer argument if you don't like 4
        endWithNewline()
    }
    java {
        leadingTabsToSpaces(4)
        eclipse().configFile('config/formatter/eclipse-java-google-style.xml')
    }
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}


// `publish` is Gradle's own task; the Central Portal upload runs under `publishToMavenCentral`.
// Both need the same prerequisites, or a CI job invoking the latter silently skips check.
// Task names are given as Strings so this block does not depend on declaration order.
tasks.matching { it.name in ['publish', 'publishToMavenCentral'] }.configureEach {
    dependsOn('check')
}

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()

    coordinates(group, "MJdbcUtils", version)

    pom {
        name.set('MJdbcUtils')
        description.set('Java Library for Named Parameters (e.g. :Customer_Id ) in Queries or DML/DDL statements.')
        url.set('https://manticore-projects.com/MJdbcUtils/index.html')

        licenses {
            license {
                name.set('The Apache Software License, Version 2.0')
                url.set('http://www.apache.org/licenses/LICENSE-2.0.txt')
            }
            license {
                name.set('GNU General Public License, version 2 or later')
                url.set('https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt')
            }
        }

        developers {
            developer {
                id.set('are')
                name.set('Andreas Reichel')
                email.set('andreas@manticore-projects.com')
            }
        }

        scm {
            connection.set('scm:git:https://github.com/manticore-projects/MJdbcUtils.git')
            developerConnection.set('scm:git:ssh://git@github.com:manticore-projects/MJdbcUtils.git')
            url.set('https://github.com/manticore-projects/MJdbcUtils.git')
        }
    }
}

// The one and only publication. Declared after the `java` block so that the sourcesJar and
// javadocJar tasks already exist.
publishing {
    publications.withType(MavenPublication).configureEach {
        versionMapping {
            usage('java-api') {
                fromResolutionOf('runtimeClasspath')
            }
            usage('java-runtime') {
                fromResolutionResult()
            }
        }
    }
}

// Signing and its task wiring are handled by mavenPublishing.signAllPublications() above.
// The hand-rolled `publishing { repositories { maven { name = "ossrh" ... } } }` block that used
// to live here uploaded to the legacy staging API and never published the deployment, so releases
// stayed staged forever. The Central Portal upload is now done by the plugin.

tasks.register('gitChangelogTask', GitChangelogTask) {
    fromRepo.set(file("$projectDir").toString())
    file.set(new File("${projectDir}/src/site/sphinx/changelog.rst"))

    // switch off the formatter since the indentation matters for Mark-down
    // @formatter:off
    templateContent.set("""
************************
Changelog
************************


{{#tags}}
{{#ifMatches name "^Unreleased.*"}}
Latest Changes since |JAVA_FPNG_VERSION|
{{/ifMatches}}
{{#ifMatches name "^(?!Unreleased).*"}}
Version {{name}}
{{/ifMatches}}
=============================================================

 {{#issues}}

  {{#commits}}
   {{#ifMatches messageTitle "^(?!Merge).*"}}
  * **{{{messageTitle}}}**
    
    {{authorName}}, {{commitDate}}
   {{/ifMatches}}
  {{/commits}}

 {{/issues}}
{{/tags}}
""")
    // @formatter:on
}